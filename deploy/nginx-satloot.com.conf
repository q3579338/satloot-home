# satloot.com —— 项目总览首页（纯静态单页）。www 一律 301 到裸域。
# 装法：放进 /etc/nginx/sites-available/satloot.com，软链到 sites-enabled/，nginx -t 通过后 reload。
# 证书沿用本机自签（Cloudflare 回源 Full 模式），和其它 satloot 子站一致。不反代、无写接口。

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.satloot.com;
    ssl_certificate     /etc/ssl/certs/satloot-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/satloot-selfsigned.key;
    return 301 https://satloot.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name satloot.com;

    ssl_certificate     /etc/ssl/certs/satloot-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/satloot-selfsigned.key;

    root /var/www/satloot-home;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_vary on;

    add_header X-Content-Type-Options nosniff always;

    location ~ \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
